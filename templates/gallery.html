<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <style>
        /* Include base styles from previous or your original */
        :root { /* Re-declare variables */
            --primary: #17a2b8; --primary-light: #58c7d6; --primary-dark: #107a8b; --accent: #ff9642; --select-highlight: rgba(255, 150, 66, 0.2);
        }
        body { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; font-family: Arial, sans-serif; min-height: 100vh; padding: 20px 0; }
        .main-gallery-container { background: rgba(255, 255, 255, 0.98); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); margin-top: 20px; min-height: 85vh; }

        /* --- Layout Specific Styles --- */
        .controls-sidebar {
            background-color: rgba(248, 249, 250, 0.8); /* Light background for sidebar */
            padding: 20px;
            border-radius: 10px;
            height: fit-content; /* Adjust or set fixed height with overflow */
            color: #333;
            margin-bottom: 20px; /* Space on mobile */
        }
        .controls-sidebar h4 {
            color: var(--primary-dark);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .action-buttons .btn, .control-group .btn {
            width: 100%;
            margin-bottom: 10px;
            font-size: 0.9em; /* Slightly smaller buttons */
        }
        .action-buttons .btn-primary { /* Make primary download buttons stand out */
            background-color: var(--accent); border-color: var(--accent);
        }
        .action-buttons .btn-primary:hover {
            background-color: #e67e22; border-color: #d35400;
        }
        .action-buttons .btn-secondary {
            background-color: var(--primary-light); border-color: var(--primary-light);
            color: white;
        }
        .action-buttons .btn-secondary:hover {
            background-color: var(--primary); border-color: var(--primary);
        }
        .search-input { margin-bottom: 20px; /* Add space below search */ }

        #galleryMetadata {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            font-size: 0.9em;
            color: #555;
        }

        /* --- Gallery Grid Styles (Keep previous card styles) --- */
        .image-grid-container { padding-left: 25px; /* Space between sidebar and grid */ }
        @media (max-width: 767px) {
            .image-grid-container { padding-left: 0; } /* No extra space on mobile */
        }

        .image-card { /* Keep card styling */
            border-radius: 10px; transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s; cursor: pointer; background: white;
            padding: 6px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.07); height: 100%; display: flex; flex-direction: column; border: 2px solid transparent;
            position: relative;
        }
        .image-card.selected { border-color: var(--accent); background-color: var(--select-highlight); box-shadow: 0 6px 15px rgba(255, 150, 66, 0.3); }
        .image-card:hover:not(.selected) { transform: translateY(-4px); box-shadow: 0 8px 18px rgba(23, 162, 184, 0.15); }
        .card-img-container { overflow: hidden; border-radius: 6px; width: 100%; height: 140px; /* Adjust size */ }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .image-card:hover .card-img { transform: scale(1.05); }
        .image-info { padding: 10px 5px 5px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .image-title { color: var(--primary-dark); font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-checkbox { position: absolute; top: 10px; left: 10px; z-index: 10; transform: scale(1.2); }

        /* Keep Modal styles */
        .modal-content { border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .modal-header { background: linear-gradient(to right, var(--primary), var(--primary-light)); color: white; border: none; padding: 20px 25px; }
        .modal .btn-close { filter: brightness(0) invert(1); /* Make close button white */ } /* BS5 */
        /* Keep empty state styles */
        .empty-state { padding: 40px; text-align: center; color: var(--primary); }
        .empty-state-icon { width: 70px; height: 70px; margin-bottom: 15px; fill: var(--primary-light); opacity: 0.6; }
        .empty-message { color: var(--primary-dark); margin-bottom: 10px; }
    </style>
    <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery-ui.js') }}"></script>
</head>
<body>
    <div class="container-fluid px-lg-4">
        <div class="main-gallery-container">
            <div class="row">

                <div class="col-lg-2 col-md-3">
                    <aside class="controls-sidebar">
                        <h4>Controls</h4>

                        <div class="control-group search-wrapper mb-3">
                            <label for="search" class="form-label fw-bold">Search</label>
                            <input type="text" id="search" class="form-control form-control-sm search-input" placeholder="Filename or description...">
                        </div>

                        <div class="control-group action-buttons">
                            <label class="form-label fw-bold">Selection</label>
                            <button id="selectAllBtn" class="btn btn-secondary btn-sm">Select All Visible</button>
                            <button id="deselectAllBtn" class="btn btn-secondary btn-sm">Deselect All</button>
                        </div>

                        <div class="control-group action-buttons mt-3">
                            <label class="form-label fw-bold">Download</label>
                            <button id="downloadSelectedBtn" class="btn btn-primary btn-sm" disabled>Download Selected</button>
                            <button id="downloadAllBtn" class="btn btn-primary btn-sm">Download All Visible</button>
                        </div>

                        <div id="galleryMetadata" class="control-group">
                            <label class="form-label fw-bold">Info</label>
                            <p id="totalImagesText">Total Images: Loading...</p>
                            <p id="visibleImagesText">Visible: Loading...</p>
                        </div>
                    </aside>
                </div>

                <div class="col-lg-10 col-md-9">
                    <div class="image-grid-container">
                        <h3 class="mb-3" style="color: var(--primary-dark);">Image Gallery</h3>

                        <div class="row" id="galleryContainer">
                            <div class="col-12 text-center" id="loadingIndicator">
                                <p style="color: var(--primary-dark);">Loading images...</p>
                                <div class="spinner-border text-info" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="imageModal" tabindex="-1" role="dialog" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Image Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImage" src="" alt="Image Preview" class="img-fluid rounded">
                </div>
                <div class="modal-footer">
                    <a id="modalDownloadBtn" href="#" class="btn btn-primary" download>Download This Image</a>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Keep existing variable declarations...
            const galleryContainer = $("#galleryContainer");
            const searchInput = $("#search");
            const loadingIndicator = $("#loadingIndicator"); // Make sure this ID exists in your HTML
            const downloadSelectedBtn = $("#downloadSelectedBtn");
            const downloadAllBtn = $("#downloadAllBtn"); // Ensure this ID exists
            const selectAllBtn = $("#selectAllBtn");     // Ensure this ID exists
            const deselectAllBtn = $("#deselectAllBtn"); // Ensure this ID exists

            // --- Metadata Elements ---
            const totalImagesText = $("#totalImagesText");
            const visibleImagesText = $("#visibleImagesText");

            let currentImagesData = [];
            let selectedImagePaths = new Set();

            // --- Core Function to Render Gallery ---
            function renderGallery(images) {
                galleryContainer.empty();
                currentImagesData = images;
                visibleImagesText.text(`Visible: ${images.length}`);
                if (!images || images.length === 0) {
                    galleryContainer.html(`
                            <div class="col-12 empty-state">
                                <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"> <path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16l4 4-.01-18zM18 14H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"></path> </svg>
                                <h4 class="empty-message">No images found</h4>
                                <p class="text-muted">Try adjusting your search or upload some images.</p>
                            </div>`);
                    downloadAllBtn.prop('disabled', true);
                    selectAllBtn.prop('disabled', true);
                    updateSelectedButtonState();
                    return;
                }
                downloadAllBtn.prop('disabled', false);
                selectAllBtn.prop('disabled', false);
                images.forEach(image => {
                    let imageUrl = image.url;
                    let fileName = image.filename;
                    let imagePath = image.filepath;
                    let colDiv = $('<div class="col-lg-4 col-md-6 col-sm-6 mb-3">');
                    let cardDiv = $(`<div class="image-card" data-id="${imagePath}">`);
                    let checkbox = $(`<input type="checkbox" class="card-checkbox form-check-input">`);
                    checkbox.prop('checked', selectedImagePaths.has(imagePath));
                    checkbox.on('change', function(e) { e.stopPropagation(); handleSelection(imagePath, $(this).prop('checked')); });
                    let imgContainer = $('<div class="card-img-container">');
                    let imgElement = $('<img>').attr("src", imageUrl).addClass("card-img").attr("alt", fileName);
                    imgContainer.append(imgElement);
                    let infoDiv = $('<div class="image-info">');
                    let titleDiv = $('<div class="image-title">').text(fileName).attr('title', fileName);
                    infoDiv.append(titleDiv);
                    cardDiv.append(checkbox, imgContainer, infoDiv);
                    cardDiv.on('click', function(e) {
                        if (!$(e.target).is('input[type="checkbox"]')) {
                            $("#modalImage").attr("src", imageUrl);
                            $("#modalTitle").text(fileName);
                            let encodedPath = encodeURIComponent(imagePath);
                            $("#modalDownloadBtn").attr("href", `/download/image/${encodedPath}`);
                            $("#modalDownloadBtn").attr("download", fileName);
                            var imageModal = new bootstrap.Modal(document.getElementById('imageModal'));
                            imageModal.show();
                        }
                    });
                    if (selectedImagePaths.has(imagePath)) { cardDiv.addClass('selected'); }
                    colDiv.append(cardDiv);
                    galleryContainer.append(colDiv);
                });
                updateSelectedButtonState();
            }

            // --- Function to Fetch Images ---
            function fetchImages(searchTerm = "") {
                loadingIndicator.show();
                galleryContainer.empty();
                downloadAllBtn.prop('disabled', true);
                visibleImagesText.text(`Visible: Loading...`);
                totalImagesText.text(`Total Images: Loading...`);
                let apiUrl = '/api/images';
                if (searchTerm) { apiUrl += `?search=${encodeURIComponent(searchTerm)}`; }
                $.ajax({
                    url: apiUrl, method: 'GET', dataType: 'json',
                    success: function(data) {
                        if (data && data.images) {
                            renderGallery(data.images);
                            totalImagesText.text(`Total Images: ${data.total_count || 0}`);
                        } else { renderGallery([]); totalImagesText.text(`Total Images: 0`); }
                    },
                    error: function(jqXHR, textStatus, errorThrown) {
                        console.error("Error fetching images:", textStatus, errorThrown);
                        galleryContainer.html('<div class="col-12 alert alert-danger">Could not load images...</div>');
                        visibleImagesText.text(`Visible: Error`); totalImagesText.text(`Total Images: Error`);
                    },
                    complete: function() { loadingIndicator.hide(); }
                });
            }

            // --- Selection Handling ---
            function handleSelection(imagePath, isSelected) {
                const card = $(`.image-card[data-id="${imagePath.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"]`);
                if (isSelected) { selectedImagePaths.add(imagePath); card.addClass('selected'); }
                else { selectedImagePaths.delete(imagePath); card.removeClass('selected'); }
                updateSelectedButtonState();
            }

            // --- Update Button States ---
            function updateSelectedButtonState() {
                downloadSelectedBtn.prop('disabled', selectedImagePaths.size === 0);
                deselectAllBtn.prop('disabled', selectedImagePaths.size === 0);
                const totalVisible = currentImagesData.length;
                const allVisibleSelected = totalVisible > 0 && currentImagesData.every(img => selectedImagePaths.has(img.filepath));
                selectAllBtn.prop('disabled', totalVisible === 0 || allVisibleSelected);
            }

            // --- Event Listeners ---
            let searchTimeout;
            searchInput.on("input", function() { // Make sure searchInput is defined if using this
                clearTimeout(searchTimeout);
                const query = $(this).val();
                searchTimeout = setTimeout(() => { fetchImages(query); }, 300);
            });

            downloadSelectedBtn.on('click', function() {
                if (selectedImagePaths.size > 0) {
                    const encodedPaths = Array.from(selectedImagePaths).map(p => encodeURIComponent(p)).join(',');
                    window.location.href = `/download/selected?paths=${encodedPaths}`;
                }
            });

            downloadAllBtn.on('click', function() { // Corrected typo from previous step here too
                const visibleImagePaths = currentImagesData.map(img => img.filepath);
                if (visibleImagePaths.length > 0) {
                    const encodedPaths = visibleImagePaths.map(p => encodeURIComponent(p)).join(',');
                    window.location.href = `/download/selected?paths=${encodedPaths}`;
                } else { alert("No images are currently visible to download."); }
                // OR window.location.href = '/download/all';
            });

            selectAllBtn.on('click', function() {
                currentImagesData.forEach(image => {
                    const imagePath = image.filepath;
                    if (!selectedImagePaths.has(imagePath)) {
                        selectedImagePaths.add(imagePath);
                        $(`.image-card[data-id="${imagePath.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"]`).addClass('selected').find('.card-checkbox').prop('checked', true);
                    }
                });
                updateSelectedButtonState();
            });

            deselectAllBtn.on('click', function() {
                selectedImagePaths.clear();
                $('.image-card.selected').removeClass('selected').find('.card-checkbox').prop('checked', false);
                updateSelectedButtonState();
            });

            // --- Initial Load ---
            fetchImages();
        });

    </script>
</body>
</html>
